name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Unit tests, plus the published bench results: hashes and privacy scan.
      - run: npm test

  checks:
    name: checks (manifests, bench tasks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JSON files parse
        run: node -e "for (const f of process.argv.slice(1)) JSON.parse(require('fs').readFileSync(f, 'utf8'))" .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json bench/tasks/*/task.json
      # Every hidden test fails on its fixture and passes on its reference solution.
      - run: node bench/validate.mjs
